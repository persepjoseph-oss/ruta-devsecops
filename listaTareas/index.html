<!DOCTYPE html>
<html lang="es-PE">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="con">
        <h2>Lista 1</h2>
        <input type="text" id="nuevaTarea" placeholder="Escribe una tarea">
        <button id="btnAgregar">Agregar</button>
        <button id="btnBorrar">Eliminar Todo</button>
        <ul id="lista"></ul>

        <h2>Lista 2</h2>
        <input type="text" id="segundaTarea" placeholder="Escribe otra tarea">
        <button id="btnAgregar2">Agregar</button>
        <button id="btnBorrar2">Eliminar Todo</button>
        <ol id="lista2"></ol>
    </div>

    <script src="app.js"></script>
</body>
</html>
